<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #06030c 100%);
            margin: 0;
            padding: 80px 60px;
            width: 1080px;
            height: 1920px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        /* Luces de fondo decorativas para Story */
        .glow-top {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            top: -200px;
            left: -200px;
            z-index: 1;
            pointer-events: none;
        }

        .glow-bottom {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -200px;
            right: -200px;
            z-index: 1;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            margin-bottom: 40px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-dot {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
        }

        .brand {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .badge {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.5);
            text-transform: uppercase;
        }

        .card {
            background: rgba(17, 12, 28, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 70px 50px;
            border-radius: 40px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 45px;
            z-index: 2;
            flex-grow: 1;
            justify-content: center;
            margin-bottom: 60px;
        }

        .job-title {
            font-size: 64px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.25;
            letter-spacing: -1.5px;
        }

        .meta-info {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .meta-tag {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 28px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .meta-tag strong {
            color: #ffffff;
        }

        .meta-tag.location {
            border-color: rgba(6, 182, 212, 0.4);
            background: rgba(6, 182, 212, 0.07);
            color: #22d3ee;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            width: 100%;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 22px;
            color: #818cf8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .requirements {
            font-size: 28px;
            color: #cbd5e1;
            line-height: 1.7;
            margin: 0;
            max-height: 480px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 8;
            -webkit-box-orient: vertical;
            white-space: pre-line;
        }

        .contact-box {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.12) 0%, rgba(139, 92, 246, 0.12) 100%);
            border: 1px solid rgba(6, 182, 212, 0.35);
            padding: 35px 45px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .contact-label {
            font-size: 20px;
            color: #22d3ee;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .contact-text {
            font-size: 34px;
            color: #ffffff;
            font-weight: 800;
            margin: 0;
            word-break: break-all;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>
    <div class="glow-top"></div>
    <div class="glow-bottom"></div>
    
    <div class="header">
        <div class="brand-container">
            <div class="brand-dot"></div>
            <div class="brand">{{marca_local}}</div>
        </div>
        <div class="badge">Nueva Vacante</div>
    </div>
    
    <div class="card">
        <h1 class="job-title">{{puesto}}</h1>
        
        <div class="meta-info">
            <div class="meta-tag">
                <span>🏢</span>
                <span>Empresa: <strong>{{empresa}}</strong></span>
            </div>
            <div class="meta-tag location">
                <span>📍</span>
                <span>Ubicación: <strong>{{ubicacion}}</strong></span>
            </div>
        </div>
        
        <div class="divider"></div>
        
        <div class="section">
            <div class="section-title">Requisitos y Detalles</div>
            <div class="requirements">{{requisitos}}</div>
        </div>
    </div>
    
    <div class="contact-box">
        <div class="contact-label">¿Cómo postularse? Envía info a:</div>
        <p class="contact-text">{{contacto}}</p>
    </div>
</body>
</html>
