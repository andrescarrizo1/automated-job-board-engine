<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #090514 100%);
            margin: 0;
            padding: 50px;
            width: 1000px;
            height: 1000px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #f8fafc;
            overflow: hidden;
        }

        /* Efecto de luz de fondo */
        .glow-effect {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: 1;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .badge {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            text-transform: uppercase;
        }

        .card {
            background: rgba(17, 12, 28, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 45px;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 2;
            flex-grow: 1;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .job-title {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.25;
            letter-spacing: -1px;
        }

        .meta-info {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .meta-tag {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-tag strong {
            color: #f1f5f9;
        }

        .meta-tag.location {
            border-color: rgba(6, 182, 212, 0.3);
            background: rgba(6, 182, 212, 0.05);
            color: #22d3ee;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            width: 100%;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 18px;
            color: #818cf8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .requirements {
            font-size: 22px;
            color: #cbd5e1;
            line-height: 1.7;
            margin: 0;
            max-height: 250px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            white-space: pre-line;
        }

        .contact-box {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border: 1px solid rgba(6, 182, 212, 0.25);
            padding: 25px 35px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .contact-label {
            font-size: 16px;
            color: #22d3ee;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-text {
            font-size: 26px;
            color: #ffffff;
            font-weight: 800;
            margin: 0;
            word-break: break-all;
            letter-spacing: -0.5px;
        }
    </style>
</head>
<body>
    <div class="glow-effect"></div>
    
    <div class="header">
        <div class="brand-container">
            <div class="brand-dot"></div>
            <div class="brand">{{marca_local}}</div>
        </div>
        <div class="badge">Nueva Vacante</div>
    </div>
    
    <div class="card">
        <h1 class="job-title">{{puesto}}</h1>
        
        <div class="meta-info">
            <div class="meta-tag">
                <span>🏢</span>
                <span>Empresa: <strong>{{empresa}}</strong></span>
            </div>
            <div class="meta-tag location">
                <span>📍</span>
                <span>Ubicación: <strong>{{ubicacion}}</strong></span>
            </div>
        </div>
        
        <div class="divider"></div>
        
        <div class="section">
            <div class="section-title">Requisitos y Detalles</div>
            <div class="requirements">{{requisitos}}</div>
        </div>
        
        <div class="contact-box">
            <div class="contact-label">¿Cómo postularse? Envía info a:</div>
            <p class="contact-text">{{contacto}}</p>
        </div>
    </div>
</body>
</html>
